discovery:
  path: /.well-known/agent-card.json
  canonical: true
  host: grokandmon.com
  note: >-
    Served from the registrable domain grokandmon.com (Cloudflare-fronted, HTTP 200, application/json,
    6,370 bytes) - the exact URL the a2aregistry.org record this repo was harvested from names as
    wellKnownURI. The legacy /.well-known/agent.json path ALSO answers 200 application/json but with a
    DIFFERENT, older document (name "GanjaMon", version 0.1.0, three skills, apiKey securitySchemes),
    saved verbatim as grokandmon-com-agent-card-legacy.json for evidence. A third variant is served by
    GET /a2a, GET /a2a/v1 and the JSON-RPC method agent/info (five skills, a different payTo address).
    www.grokandmon.com does not resolve (NXDOMAIN). Every other /.well-known/* path on the apex,
    including a random negative control, returns the 400,958-byte homepage HTML with an application/json
    content-type header - an SPA catch-all - so the two card paths and x402-pricing.json are the only
    real documents under /.well-known/ (see well-known/grokandmon-com-well-known.yml).
conformance:
  spec: A2A 1.0.0
  grade: conformant
  grade_basis: >-
    All three hard checks pass: capabilities is an OBJECT ({streaming: false, pushNotifications: false,
    stateTransitionHistory: true, x402Payments: true}), protocolVersion is present ("0.3.0"), and skills
    is an ARRAY of seven entries each carrying id, name, description, tags and examples. The optional
    fields that separate conformant from near-conformant are all present: preferredTransport ("JSONRPC"),
    defaultInputModes and defaultOutputModes ([application/json, text/plain]). The card also carries
    provider, iconUrl, documentationUrl, version and supportsAuthenticatedExtendedCard. The grade is about
    the document's shape; the deviations below record the non-spec vocabulary around that shape and the
    inconsistencies between the four skill inventories this provider publishes.
  protocol_version: '0.3.0'
  preferred_transport: JSONRPC
  deviations:
    - id: skill-count-contradicts-description
      severity: soft
      detail: >-
        The description says "23 A2A skills including grow oracle, plant vision, alpha scanning, on-chain
        grow log, and rasta translation"; skills[] carries 7 (alpha-scan, cultivation-status, signal-feed,
        trade-execution, agent-validate, x402-oracle, art-studio). None of the five named in the prose
        appears as a skill id. The a2a.html page lists a fifth inventory under "Registered Skills"
        (oracle, grow-advisor, alpha-signals, grow-monitor, rasta-wisdom), the /a2a and /a2a/v1 GET
        variant carries 5 skills and the legacy agent.json carries 3.
    - id: additionalInterfaces-non-spec-transports
      severity: soft
      detail: >-
        additionalInterfaces declares transports "MCP" (https://grokandmon.com/mcp/v1) and "REST" (three
        /a2a/v1/acp/* endpoints). A2A's TransportProtocol values are JSONRPC, GRPC and HTTP+JSON; an
        A2A client reading the field cannot bind either. The MCP and ACP surfaces are real (probed
        below) - this is a vocabulary problem, not a liveness one.
    - id: capabilities-non-spec-key
      severity: soft
      detail: >-
        capabilities carries x402Payments: true, which is not an AgentCapabilities field, and declares
        no extensions[] - the a2a-x402 extension URI that other x402 agents use to signal payment is not
        used, so a spec client has no conformant way to learn that calls are priced.
    - id: no-securitySchemes
      severity: soft
      detail: >-
        The canonical card declares no securitySchemes and no security. Payment is the gate: the
        top-level x402 block (non-spec) and the a2a.html page describe a PAYMENT-SIGNATURE header carrying
        an EIP-3009 USDC transferWithAuthorization, and the endpoint's CORS policy allows X-Payment,
        X-402-Payment, X-Payment-Address, X-Payment-Amount, X-Payment-Token and X-Payment-Network. The
        legacy agent.json instead declares apiKey in the Authorization header.
    - id: payTo-differs-between-card-variants
      severity: informational
      detail: >-
        The well-known card, x402-pricing.json and the a2a.html "Owner" field all name
        eip155:10143:0x734B0e337bfa7d4764f4B806B4245Dd312DdF134; the /a2a, /a2a/v1 and agent/info variant
        names eip155:10143:0x794c94f1b5E455c1dBA27BB28C6085dB0FE544F9. A payer following the JSON-RPC
        surface pays a different address than one following the well-known card.
    - id: network-inconsistency-monad-vs-base
      severity: informational
      detail: >-
        The card's x402 block says network "monad", chainId 10143 (Monad testnet); the x402-oracle skill
        description says "Accepts USDC on Base"; a2a.html says "USDC transferred on Base"; the pricing
        document lists both monad 10143 and base 8453 under supportedNetworks with the same payTo.
    - id: docs-describe-pre-0.3-methods
      severity: informational
      detail: >-
        a2a.html says "Methods include tasks/send, tasks/get, and tasks/cancel. Agents discover each
        other via /.well-known/agent.json" - the pre-0.3 method and path names. The live endpoint's own
        error data lists message/send, tasks/get, tasks/cancel and agent/info.
    - id: non-spec-top-level-keys
      severity: informational
      detail: x402 is not an A2A field; a strict A2A parser ignores it.
    - id: registry-task-conformance-failed
      severity: hard-in-practice
      detail: >-
        a2aregistry.org's own record (id 25ec42b7-c987-4e23-a9d1-bc231c4e7292, checked 2026-09-20T00:58Z)
        marks card conformance true but task_conformance {category: BAD_RESPONSE, passed: false}, with the
        maintainer note "Agent responds but the response shape is missing required A2A fields. Standard
        A2A SDK clients cannot parse the response." This pass did not exercise message/send (every skill
        is priced) and cannot independently confirm or refute that.
    - id: endpoint-answers-jsonrpc
      severity: positive
      detail: >-
        POST https://grokandmon.com/a2a/v1 is a live JSON-RPC 2.0 endpoint: tasks/get without a taskId
        returned HTTP 200 {"error":{"code":-32602,"message":"Invalid params: taskId required"}}; an
        unknown method returned HTTP 404 with -32601 and data.available [message/send, tasks/get,
        tasks/cancel, agent/info]; agent/info returned the five-skill card variant. The three ACP REST
        endpoints answer GET 200 with sample/schema payloads whose _note says live data comes from the
        "Chromebook API" - the /api/* origin, which answered 530 (Cloudflare Tunnel error) throughout.
    - id: iconUrl-5mb
      severity: informational
      detail: iconUrl is a 5,537,118-byte PNG (HTTP 200, image/png).
