apis:
- aid: grokandmon-com:ganjamon-a2a-agent
  name: GanjaMon AI A2A Agent
  description: >-
    Agent2Agent (A2A) protocol surface: an agent card served from https://grokandmon.com/.well-known/agent-card.json
    (protocolVersion 0.3.0, JSONRPC transport, version 2.1.0, graded conformant on shape) advertising seven
    skills - alpha-scan, cultivation-status, signal-feed, trade-execution, agent-validate, x402-oracle and
    art-studio - priced per call in USDC via x402 (EIP-3009) with a 100-request/day free tier. The JSON-RPC
    endpoint at https://grokandmon.com/a2a/v1 answers message/send, tasks/get, tasks/cancel and agent/info;
    three ACP REST endpoints (/a2a/v1/acp/grow, /signals, /oracle) answer GET with schema/sample payloads.
    A different, older card (v0.1.0, three skills) is still served at the legacy /.well-known/agent.json.
  humanURL: https://grokandmon.com/a2a.html
  baseURL: https://grokandmon.com/a2a/v1
  tags:
  - A2A
  - Agent-Native
  - x402
  - ERC-8004
  tags_raw:
  - A2A
