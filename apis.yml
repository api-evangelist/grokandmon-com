  - type: Pricing
    url: https://grokandmon.com/.well-known/x402-pricing.json
- aid: grokandmon-com:ganjamon-mcp-server
  name: GanjaMon MCP Server
  description: >-
    Remote Model Context Protocol server at https://grokandmon.com/mcp/v1 (also answers at /mcp; protocol
    version 2025-06-18, server version 1.0.0). initialize and tools/list answer anonymously with 22 tools -
    11 sensor reads (environment, substrate moisture, light, growth stage, history, watering predictions, AI
    decision log) and 11 actuator writes (lights, fans, humidifier, dehumidifier, heat mat, irrigation,
    growth-stage transition, observation log) - each with a real inputSchema. tools/call returned an
    acknowledgement stub rather than executing when probed; resources/list and prompts/list are not
    implemented. No credential and no OAuth metadata.
  humanURL: https://grokandmon.com/a2a.html
  baseURL: https://grokandmon.com/mcp/v1
  tags:
  - MCP
  - Agent-Native
  - IoT
  tags_raw:
  - MCP
  - agent-native
  - IoT
  properties:
  - type: MCPServer
    url: mcp/grokandmon-com-mcp.yml
  - type: MCPServer
    name: GanjaMon MCP endpoint (Streamable HTTP)
    url: https://grokandmon.com/mcp/v1
- aid: grokandmon-com:grokandmon-rest-api
  name: Grok & Mon REST API
  description: >-
    The JSON REST origin under https://grokandmon.com/api/ that the website, the MCP tools and the ACP
    endpoints defer to for live data: sensor history, hourly aggregates, AI decision history, plant
    progress, webcam status and image, token metrics, comments, and the x402-priced art-studio and oracle
    endpoints (/api/x402/art/*, /api/x402/oracle, /api/x402/grow-alpha, /api/x402/daily-vibes,
    /api/x402/sensor-snapshot) named in the pricing document. No contract is published for it, and every
    path answered HTTP 530 (Cloudflare Tunnel error to an origin the provider's own payloads call the
    "Chromebook API") throughout this pass, so the paths recorded here come from the provider's page
    scripts and pricing document, not from a response.
  humanURL: https://grokandmon.com/
  baseURL: https://grokandmon.com/api
  tags:
  - REST
  - x402
  - IoT
  properties:
