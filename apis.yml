aid: grokandmon-com
name: Grok & Mon
description: >-
  Grok & Mon operates GanjaMon AI, an autonomous ERC-8004 agent (agent #4 on Monad) that runs a real
  cannabis grow tent through IoT sensors and actuators, aggregates trading signals from nine on-chain and
  social sources, and sells its outputs to other agents. Its published surface is agent-native rather than
  REST-first: an A2A 0.3.0 agent card at /.well-known/agent-card.json with seven skills, a JSON-RPC
  endpoint at /a2a/v1, three ACP REST endpoints, a remote MCP server at /mcp/v1 listing 22 grow-tent tools,
  and an x402 pricing document quoting per-call USDC prices with a 100-request/day free tier. It publishes
  no OpenAPI, SDK, security.txt or status page, and its /api/* REST origin was unreachable (HTTP 530) when
  profiled.
