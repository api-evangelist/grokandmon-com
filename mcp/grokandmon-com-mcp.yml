summary: >-
  Grok & Mon operates ONE remote MCP server at https://grokandmon.com/mcp/v1 (the same path also answers at
  /mcp), on the same host as its website and A2A endpoint. It speaks MCP protocol version 2025-06-18, answers
  initialize and tools/list anonymously, and lists 22 tools - 11 reads over a real cannabis grow tent's IoT
  sensors (environment, substrate moisture, light, growth stage, history, watering predictions, AI decision
  log) and 11 actuator writes (light intensity and schedule, exhaust/intake/circulation fans, humidifier,
  dehumidifier, heat mat, irrigation 10-150 ml, growth-stage transition, observation log), each with a real
  inputSchema. GET on the endpoint returns a static descriptor document carrying the same tool list.
  resources/list and prompts/list return -32601. THE CALL SURFACE IS A STUB: tools/call on the read-only
  get_environment returned HTTP 200 with the text "Tool get_environment acknowledged. Connect to the agent
  API for live execution." rather than sensor data, so the server enumerates tools but does not execute
  them; live execution is routed to the /api/* origin, which answered 530 (Cloudflare Tunnel error)
  throughout this pass. No write tool was invoked. Authorship is the provider's: the tool names are specific
  to this one grow (Ecowitt GW1100 sensor, GDP Runtz strain) and match no shared platform fingerprint.
deployment:
  mode: remote
  endpoint: https://grokandmon.com/mcp/v1
  auth: none
  verified: probed
  note: >-
    A hosted HTTPS endpoint an MCP client POSTs to directly; no stdio package, no npx/uvx install is
    published anywhere (npm, PyPI and GitHub searched, 0 results). auth is "none" in the connection sense -
    initialize, tools/list and tools/call needed no credential and no Mcp-Session-Id was issued - and no
    OAuth metadata is served on the host (/.well-known/oauth-authorization-server and
    /.well-known/oauth-protected-resource both return the SPA shell). The agent card advertises x402
    micropayment on the A2A surface; no 402 challenge was observed on the MCP surface, whose tools/call
    only acknowledges.
