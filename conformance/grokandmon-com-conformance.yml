summary: >-
  Grok & Mon's conformance profile is the agent-commerce protocol stack: an A2A 0.3.0 agent card (graded
  conformant on shape), an MCP server at protocol version 2025-06-18, JSON-RPC 2.0 on both, x402 USDC
  micropayments declared on the card and in a pricing document (not exercised), and ERC-8004 on-chain agent
  registration (agent #4 on Monad, visible on 8004scan.io). It declares no OAuth/OIDC, no RFC 9457 problem
  details, no RFC 9116 security.txt, no RFC 9727 API catalog, no RFC 8594 sunset signalling, no APIs.json.
  The domain-standard signature for this market is ERC-8004 + A2A + x402, and the card carries all three
  in its own fields; the caveat is that a2aregistry.org's task-conformance check against the live endpoint
  failed (BAD_RESPONSE), so shape conformance and behavioural conformance diverge here.
standards:
- id: a2a
  name: Agent2Agent protocol
  version: '0.3.0'
  conforms: true
  evidence: >-
    a2a/grokandmon-com-agent-card.json - protocolVersion "0.3.0", url https://grokandmon.com/a2a/v1,
    preferredTransport JSONRPC, capabilities object, skills[] of 7; POST https://grokandmon.com/a2a/v1
    tasks/get answered JSON-RPC -32602 Invalid params and an unknown method -32601 with data.available
    [message/send, tasks/get, tasks/cancel, agent/info]. Graded conformant in a2a/grokandmon-com-a2a.yml.
  domain_standard_signature: true
  caveat: a2aregistry.org task_conformance {category BAD_RESPONSE, passed false} on 2026-09-20 - the registry's SDK client could not parse a task response.
- id: erc-8004
  name: ERC-8004 Trustless Agents (on-chain agent identity/reputation registry)
  conforms: true
  verification: partial
  evidence: >-
    The card description opens "The only ERC-8004 agent with roots in the physical world"; x402-pricing.json
